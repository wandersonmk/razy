[project]
name = "razy-ai-service"
version = "0.1.0"
description = "Serviço de IA (FastAPI + LangChain + LangGraph) para disparos do Razy."
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "asyncpg",
    "redis",
    "langchain",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "openai",
    # Leitura de documentos enviados pelo cliente (capacidade "Ler documentos").
    "pypdf",
    "python-docx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
